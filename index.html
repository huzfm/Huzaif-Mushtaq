<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8" />
      <meta http-equiv="refresh" content="3; url=https://huzfm.vercel.app" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Redirecting...</title>
      <style>
            :root {
                  --bg: #000;
                  --text: #f9f9f9;
                  --accent: #fff;
            }

            body {
                  background: var(--bg);
                  color: var(--text);
                  font-family: system-ui, sans-serif;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  height: 100vh;
                  margin: 0;
                  text-align: center;
            }

            h1 {
                  font-size: 2rem;
                  margin-bottom: 0.5rem;
            }

            p {
                  color: #999;
                  font-size: 1rem;
            }

            .spinner {
                  margin-top: 2rem;
                  width: 40px;
                  height: 40px;
                  border: 4px solid transparent;
                  border-top: 4px solid var(--accent);
                  border-right: 4px solid var(--accent);
                  border-radius: 50%;
                  animation: spin 0.8s linear infinite;
                  box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            }


            @keyframes spin {
                  to {
                        transform: rotate(360deg);
                  }
            }

            p {
                  font-size: 30px;
                  font-family: monospace;
            }

            a {
                  text-decoration: none;
            }

            h1 {
                  font-family: monospace;
            }
      </style>
</head>

<body>
      <p id="p">This webiste has been migrated to
            <a class="link" href="huzfm.vercel.app">huzfm</a>
      </p>
      <h1>Redirecting...</h1>
      <div class="spinner"></div>
</body>

</html>
